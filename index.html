<style>
:root{--bg:#17181A;--card:#212326;--card2:#1c1d1f;--line:#35383C;--tx:#F3F3F1;--mut:#A0A4A9;--red:#E4121B;--redt:#FF4D4D;--redbg:#3A1316;--r:18px}
*{box-sizing:border-box}
html,body{margin:0;background:#0f1011;color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
#app{width:100%;max-width:480px;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column}
.h1{font-family:Montserrat,Inter,sans-serif;font-style:italic;font-weight:800;letter-spacing:-.01em;margin:0}
.mut{color:var(--mut)}
.red{color:var(--redt)}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:44px;height:44px;border-radius:12px;display:block}
.brand b{font-family:Montserrat,Inter,sans-serif;font-style:italic;font-weight:800;font-size:17px;line-height:1}
.badge{border:1px solid var(--red);color:var(--redt);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;letter-spacing:.06em}
.main{flex:1;padding:4px 16px 96px}
.nav{position:fixed;bottom:0;width:100%;max-width:480px;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:0 8px env(safe-area-inset-bottom)}
.nav button{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:none;font-size:12px;font-weight:600;color:var(--mut)}
.nav button[aria-current=page]{color:var(--redt)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 10px}
.card h3{margin:0 0 8px;font-family:Montserrat,Inter,sans-serif;font-style:italic;font-weight:800;font-size:16px}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mut);margin:12px 0 6px;text-transform:uppercase}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],input[type=tel],select,textarea{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card2);padding:0 14px;font-size:16px}
textarea{padding:12px 14px;min-height:80px;resize:vertical}
input::placeholder,textarea::placeholder{color:#7d8186}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--redt);outline-offset:2px}
.btn{min-height:50px;border-radius:16px;border:0;background:var(--red);color:#fff;font-weight:700;font-size:16px;padding:0 18px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:none;border:1px solid #5A5E63;color:var(--tx);font-weight:600}
.btn.danger{background:none;border:1px solid var(--red);color:var(--redt)}
.btn.sm{min-height:44px;width:auto;font-size:14px;padding:0 14px;border-radius:12px}
.btn[disabled]{opacity:.5}
.link{background:none;border:0;min-height:44px;color:var(--redt);font-weight:600;font-size:14px;padding:0 4px}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.sp{justify-content:space-between}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;min-height:40px;border-radius:10px;border:0;background:none;color:var(--mut);font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:#F3F3F1;color:#17181A}
.err{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--redbg);border:1px solid var(--red);color:#ffd0d0;font-size:14px}
.err:empty{display:none}
.ok{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:#1d2a20;border:1px solid #2f5b3b;color:#cdeed6;font-size:14px}
.note{font-size:12px;line-height:1.5;color:var(--mut)}
.hero img{width:100%;height:auto;display:block;border-radius:20px}
.chip{display:inline-block;background:var(--redbg);color:var(--redt);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:0 0 10px;overflow:hidden}
.gh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#2b2619;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.gh span{color:var(--mut);font-weight:600}
.gh i{margin-left:auto;font-style:normal;color:var(--redt)}
.fx{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.fx .t{flex:0 0 44px;text-align:center;font-size:12px;color:var(--mut);font-weight:600}
.fx.lv .t,.fx.lv .sc{color:var(--redt)}
.fx .tm{flex:1;min-width:0}
.fx .tm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.55}
.fx .sc{flex:0 0 26px;text-align:right;font-weight:700;line-height:1.55}
.fx[data-act]{cursor:pointer}.fx[data-act]:active{background:#202226}
.bar{height:8px;border-radius:4px;background:#2a2c31;overflow:hidden;margin:4px 0 0}.bar i{display:block;height:100%;background:var(--red)}
.fm{display:inline-flex;gap:4px;margin-left:8px}.fm b{width:22px;height:22px;border-radius:6px;font-size:11px;display:flex;align-items:center;justify-content:center;color:#fff}
.fm .W{background:var(--red)}.fm .D{background:#6b7280}.fm .L{background:#33363c}
.ev{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ev .m{flex:0 0 40px;color:var(--mut);font-size:12px;font-weight:600}.ev.a{flex-direction:row-reverse;text-align:right}
.mh{text-align:center;padding:6px 0 14px}.mh .tn{font-weight:700;font-size:16px;flex:1;min-width:0}.mh .big{font-family:Montserrat,Inter,sans-serif;font-style:italic;font-weight:800;font-size:34px;letter-spacing:.04em;flex:0 0 auto;padding:0 10px}
.tk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 10px}
.tk .cd{font-family:Montserrat,Inter,sans-serif;font-style:italic;font-weight:800;font-size:26px;letter-spacing:.1em}
.tk .legs{font-size:13px;color:var(--mut);line-height:1.5;margin:8px 0 0;white-space:pre-line}
.dt{flex:0 0 auto;min-width:68px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.dt small{font-size:11px;color:var(--mut)}
.dt b{font-family:Montserrat,Inter,sans-serif;font-style:italic;font-weight:800;font-size:18px}
.dt[aria-pressed=true]{background:var(--red);border-color:var(--red)}
.dt[aria-pressed=true] small{color:#fff}
.pick{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 10px}
.meta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.teams{font-weight:700;font-size:17px;margin:6px 0 0}
.bar{margin-top:10px;height:6px;border-radius:3px;background:var(--line);position:relative}
.bar i{position:absolute;left:0;top:0;height:6px;border-radius:3px;background:var(--red)}
.bar u{position:absolute;top:-3px;width:2px;height:12px;background:#fff}
.stat{flex:1;text-align:center;padding:12px 4px}
.stat b{display:block;font-family:Montserrat,Inter,sans-serif;font-style:italic;font-weight:800;font-size:24px}
.stat span{font-size:11px;color:var(--mut)}
.nobet{text-align:center;padding:26px 6px 10px}
.nobet h2{font-size:44px;line-height:1.02;margin:14px 0 8px}
.nav button{position:relative}.bdg{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.lgs{margin:10px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.4}.lgs li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line)}.lgs .st{font-weight:700;white-space:nowrap}.lgs .st.w{color:var(--redt)}.lgs .st.l{color:var(--mut)}
.pill{display:inline-block;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.pill.w{background:var(--red);color:#fff}
.pill.l{border:1px solid #5A5E63;color:var(--mut)}
.pill.p{border:1px solid var(--red);color:var(--redt)}
.chk{display:flex;align-items:center;justify-content:space-between;min-height:48px;border-bottom:1px solid var(--line);font-size:15px;font-weight:500}
.chk:last-child{border:0}
input[type=checkbox]{accent-color:var(--red);width:22px;height:22px;margin:0}
.meter{height:8px;border-radius:4px;background:var(--line)}
.meter i{display:block;height:8px;border-radius:4px;background:var(--red)}
.top-bar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:3px;overflow:hidden;z-index:50;display:none}
.busy .top-bar{display:block}
.top-bar i{display:block;height:3px;width:40%;background:var(--red);animation:mv 1s infinite ease-in-out}
@keyframes mv{0%{margin-left:-40%}100%{margin-left:100%}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#F3F3F1;color:#17181A;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;z-index:60;max-width:90%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.modal>div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:380px;width:100%}
.code{font-family:Montserrat,Inter,sans-serif;font-style:italic;font-weight:800;font-size:34px;letter-spacing:.12em;text-align:center;margin:14px 0}
.spin{display:flex;align-items:center;justify-content:center;min-height:100vh}
.spin img{width:88px;height:88px;border-radius:22px;animation:rot 1.2s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.saved{font-size:11px;color:var(--mut);text-align:right;min-height:14px;padding:0 4px 6px}
.u{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.u:last-child{border:0}
.u b{font-size:15px}
.u small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:481px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){.spin img,.top-bar i{animation:none}}
</style>
</head>

function setBusy(b){document.body.classList.toggle('busy',!!b);var bs=document.querySelectorAll('button.btn');for(var i=0;i<bs.length;i++){if(b){if(!bs[i].disabled){bs[i].disabled=true;bs[i].dataset.b='1'}}else if(bs[i].dataset.b){bs[i].disabled=false;delete bs[i].dataset.b}}}
function money(n){n=Number(n)||0;return (Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2})}
function fmtDate(d){try{var x=new Date(d+'T00:00:00Z');return x.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})}catch(e){return d}}
function dow(d){return ['SUN','MON','TUE','WED','THU','FRI','SAT'][new Date(d+'T00:00:00Z').getUTCDay()]}

/* ---------- crypto: the password never leaves the device ---------- */
var enc=new TextEncoder(),dec=new TextDecoder();
function hex(u){var s='';for(var i=0;i<u.length;i++)s+=('0'+u[i].toString(16)).slice(-2);return s}
function b64e(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function pbk(pass,salt){
  var k=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:ITER,hash:'SHA-256'},k,256));
}
async function derive(user,pass){
  var a=await pbk(pass,'qt-auth:'+user), v=await pbk(pass,'qt-vault:'+user);
  return {auth:hex(a),raw:b64e(v)};
}
function importKey(raw){return crypto.subtle.importKey('raw',b64d(raw),'AES-GCM',false,['encrypt','decrypt'])}
async function sealVault(raw,obj){
  var key=await importKey(raw),iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(JSON.stringify(obj))));
  return b64e(iv)+'.'+b64e(ct);
}
async function openVault(raw,blob){
  var p=blob.split('.');if(p.length!==2)throw new Error('format');
  var key=await importKey(raw);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(p[0])},key,b64d(p[1]));
  return JSON.parse(dec.decode(pt));
}
function newVault(){return {v:1,codes:[],bank:{amt:0,limit:0,pct:2,cur:'GHS'},prefs:{style:'Balanced',sports:{football:true,womens:true,basketball:true}}}}
function fixVault(v){var d=newVault();v=v||{};v.codes=Array.isArray(v.codes)?v.codes:[];v.bank=Object.assign(d.bank,v.bank||{});v.prefs=Object.assign({},d.prefs,v.prefs||{});v.prefs.sports=Object.assign({},d.prefs.sports,v.prefs.sports||{});return v}

/* ---------- server calls ---------- */
async function api(d){
  var url=apiUrl();if(!url)throw {err:'NO_API'};
  var r,j;
  try{r=await fetch(url,{method:'POST',body:JSON.stringify(d)})}catch(e){throw {err:'NETWORK'}}
  try{j=await r.json()}catch(e){throw {err:'SERVER'}}
  if(!j||!j.ok){
    if(j&&j.err==='AUTH_REQUIRED'&&S.session&&d.a!=='login'){signOut('Please sign in again.');throw {err:'AUTH_REQUIRED',quiet:true}}
    throw j||{err:'SERVER'};
  }
  return j;
}
function T(){return S.session?S.session.t:''}
async function call(d){d.t=T();return api(d)}

/* ---------- session ---------- */
function saveSession(remember){
  var s=JSON.stringify(S.session);
  lsDel('qt_s');ssDel('qt_s');
  if(remember)lsSet('qt_s',s);else ssSet('qt_s',s);
}
function loadSession(){
  var s=ssGet('qt_s')||lsGet('qt_s');
  if(!s)return null;
  try{var o=JSON.parse(s);return o&&o.t&&o.role?o:null}catch(e){return null}
}
function signOut(note){
  clearTimeout(saveTimer);
  S.session=null;S.vault=null;S.picks=[];S.stats=null;S.users=null;S.modal=null;S.open=null;S.prefill=null;
  lsDel('qt_s');ssDel('qt_s');
  enterGuest(note);
}
async function enterGuest(note){
  S.session=null;S.vault=null;S.guest=true;S.view='app';S.tab='games';S.seg={picks:'today',codes:'listed',mine:'codes',apicks:'picks'};
  S.cd=null;S.perf=null;S.rec=null;S.gm.cache={};S.gm.open=null;S.gm.err='';
  S.today=S.today||new Date().toISOString().slice(0,10);S.gm.date=S.today;
  render();if(note)toast(note);
  try{await loadPicks()}catch(e){if(e&&e.err==='NETWORK')toast(msg(e))}
  S.gm.date=S.today;render();loadDay(S.today);loadCodes();
}

/* ---------- vault saving ---------- */
function touch(){
  S.saved='Saving...';paintSaved();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(!S.session||S.session.role!=='c'||!S.vault)return;
  try{
    var blob=await sealVault(S.session.raw,S.vault);
    await call({a:'putVault',blob:blob});
    S.saved='Saved and encrypted';
  }catch(e){
    S.saved=(e&&e.err==='TOO_BIG')?'Too much data. Delete old codes.':'Not saved yet. Check your internet.';
    if(e&&e.err!=='TOO_BIG'&&e.err!=='AUTH_REQUIRED')saveTimer=setTimeout(flush,8000);
  }
  paintSaved();
}
function paintSaved(){var e=$('#saved');if(e)e.textContent=S.saved}

/* ---------- boot ---------- */
async function boot(){
  if(!apiUrl()){S.view='connect';render();return}
  var s=loadSession();
  if(!s){await enterGuest();return}
  S.session=s;
  try{await enter(true)}catch(e){
    if(e&&e.err==='NETWORK'){S.view='auth';S.session=null;render();toast(msg(e));return}
    if(!(e&&e.quiet)){S.session=null;lsDel('qt_s');ssDel('qt_s');S.view='auth';render()}
  }
}
async function enter(){
  S.guest=false;S.gm.open=null;S.gm.cache={};
  if(S.session.role==='a'){
    S.view='admin';S.atab='overview';
    await adminLoad();
  }else{
    S.view='app';S.tab='games';S.seg={picks:'today',codes:'listed',mine:'codes',apicks:'picks'};
    var r=await call({a:'getVault'});
    if(r.blob){
      try{S.vault=fixVault(await openVault(S.session.raw,r.blob))}catch(e){throw {err:'SERVER'}}
    }else S.vault=newVault();
    await loadPicks();
    S.gm.date=S.today;loadDay(S.today);loadCodes();
  }
  render();
}
async function loadPicks(){
  var r=await call({a:'picks'});
  S.picks=r.picks||[];S.today=r.today||'';
  if(!S.date||S.date<S.today)S.date=S.today;
}

function pct(x){return x==null?'-':Math.round(x*100)+'%'}
function vPerf(p){
  var h='<h2 class="h1" style="font-size:18px;margin:22px 0 4px">Is the model any good?</h2><p class="mut" style="margin:0 0 10px;font-size:13px;line-height:1.4">The model saves its numbers for every match before kickoff, not only the matches we post, then checks them against the final score.</p>';
  if(!p)return h+'<p class="note">Loading...</p>';
  if(p.err)return h+'<div class="err" style="display:block">'+esc(p.err)+'</div>';
  if(!p.fixtures)return h+'<div class="card"><p class="note" style="margin:0;text-align:center;line-height:1.5">No finished matches checked yet.'+(p.pending?' '+p.pending+' waiting for a result.':'')+'</p></div>';
  var x=p.x12;
  h+='<div class="card row" style="padding:6px 0"><div class="stat"><b>'+p.fixtures+'</b><span>Matches checked</span></div><div class="stat" style="border-left:1px solid var(--line)"><b>'+pct(x.acc)+'</b><span>Result right</span></div><div class="stat" style="border-left:1px solid var(--line)"><b class="'+(x.skill>0?'red':'')+'">'+(x.skill==null?'-':(x.skill>0?'+':'')+Math.round(x.skill*100)+'%')+'</b><span>Beats guessing</span></div></div>';
  h+='<p class="note" style="line-height:1.5;margin:0 0 12px">"Result right" is how often the most likely of home, draw or away happened. "Beats guessing" compares our probabilities with just quoting how often each result happens in this sample (above 0 is better, below 0 is worse). '+(p.fixtures<100?'<b>Only '+p.fixtures+' matches so far, so treat these numbers as a rough hint, not a verdict.</b> ':'')+(p.pending?p.pending+' waiting for a result. ':'')+'A bookmaker\'s odds still know more than we do (team news, injuries), so a good model is not the same as an edge.</p>';
  h+='<div class="card"><b>By market</b><div class="note" style="margin:2px 0 8px">Right = how often our yes/no call was correct. Skill = better than guessing the usual rate.</div>';
  p.markets.filter(function(m){return m.n}).forEach(function(m){
    h+='<div class="row sp" style="padding:6px 0;border-top:1px solid var(--line);font-size:13px"><span>'+esc(m.l)+' <span class="mut">('+m.n+')</span></span><span>'+pct(m.acc)+' right · <b class="'+(m.skill>0?'red':'')+'">'+(m.skill==null?'-':(m.skill>0?'+':'')+Math.round(m.skill*100)+'%')+'</b></span></div>';
  });
  h+='</div>';
  var cs=p.calib.filter(function(c){return c.n});
  if(cs.length){
    h+='<div class="card"><b>Do the percentages mean what they say?</b><div class="note" style="margin:2px 0 8px">When we say 70%, it should happen about 70% of the time.</div>';
    cs.forEach(function(c){
      h+='<div class="row sp" style="padding:6px 0;border-top:1px solid var(--line);font-size:13px"><span>We said '+c.lo+'-'+c.hi+'% <span class="mut">('+c.n+')</span></span><span>happened <b>'+pct(c.y)+'</b></span></div>';
    });
    h+='</div>';
  }
  if(p.leagues.length){
    h+='<div class="card"><b>By league</b>';
    p.leagues.forEach(function(l){h+='<div class="row sp" style="padding:6px 0;border-top:1px solid var(--line);font-size:13px"><span>'+esc(l.league)+' <span class="mut">('+l.n+')</span></span><span>'+pct(l.acc)+' result right</span></div>'});
    h+='</div>';
  }
  return h;
}
function vRecord(){
  var r=S.rec,h='<h1 class="h1" style="font-size:28px;margin:6px 0 4px">Our record</h1><p class="mut" style="margin:0 0 12px;font-size:13px;line-height:1.4">Every pick we post is listed here with its result. Wins and losses.</p>';
  if(!r)return h+'<p class="note">Loading...</p>';
  if(r.err)return h+'<div class="err" style="display:block">'+esc(r.err)+'</div>';
  var n=r.won+r.lost;
  h+='<div class="card row" style="padding:6px 0"><div class="stat"><b class="red">'+r.won+'</b><span>Won</span></div><div class="stat" style="border-left:1px solid var(--line)"><b>'+r.lost+'</b><span>Lost</span></div><div class="stat" style="border-left:1px solid var(--line)"><b>'+(r.hit==null?'-':r.hit+'%')+'</b><span>Hit rate</span></div><div class="stat" style="border-left:1px solid var(--line)"><b class="'+(r.roi!=null&&r.roi>0?'red':'')+'">'+(r.roi==null?'-':(r.roi>0?'+':'')+r.roi+'%')+'</b><span>ROI</span></div></div>';
  h+='<p class="note" style="line-height:1.5;margin:0 0 12px">ROI is the profit per 1 unit staked on every pick at the odds we posted.'+(r.since?' Counting since '+esc(fmtDate(r.since))+'.':'')+(r.pending?' '+r.pending+' awaiting a result.':'')+(r.voided?' '+r.voided+' void (not counted).':'')+(n<30&&n>0?' This is still a small sample, so it says little yet.':'')+' Past results do not promise future ones.</p>';
  if(!r.recent.length)h+='<div class="card"><p class="note" style="margin:0;text-align:center">No picks yet. The record fills in as we post.</p></div>';
  r.recent.forEach(function(p){
    var cls=p.res==='won'?'w':p.res==='lost'?'l':'p',lab=p.res==='won'?'Won':p.res==='lost'?'Lost':p.res==='void'?'Void':'Pending';
    h+='<div class="card"><div class="row sp"><div><div class="note">'+fmtDate(p.date)+'</div><b>'+esc(p.home)+' vs '+esc(p.away)+'</b><div class="note">'+esc(p.market)+' @ '+p.odds.toFixed(2)+'</div></div><span class="pill '+cls+'">'+lab+'</span></div></div>';
  });
  h+=vPerf(S.perf);
  return h;
}

function mkGroup(k){

}

    S.lb.date=d;S.lb.busy=true;S.lb.err='';render();
    try{var r=await call({a:'adminLegPool',date:d});S.lb.games=r.games;S.lb.markets=r.markets}catch(e){if(e&&e.quiet)return;S.lb.err=msg(e)}
    S.lb.busy=false;render();
  },
  legadd:function(el){
    lfSnap();var fid=el.dataset.v,g=S.lb.games.filter(function(x){return x[0]===fid})[0];if(!g)return;
    var mk=document.getElementById('lm'+fid).value,o=Number(document.getElementById('lo'+fid).value)||0,mi=-1;
    S.lb.markets.forEach(function(m,i){if(m[0]===mk)mi=i});
    if(o&&!(o>=1.01&&o<=1000)){toast(ERR.BAD_ODDS);return}
    var p=Number(String(g[5]).split(',')[mi]);
    S.lb.legs.push({fid:fid,mk:mk,odds:o,p:p,label:g[3]+' v '+g[4]+' - '+S.lb.markets[mi][1]});render();
  },
  legdel:function(el){lfSnap();S.lb.legs.splice(Number(el.dataset.v),1);render()},
  cres:async function(el){try{await call({a:'adminCodeResult',id:el.dataset.id,res:el.dataset.v});await loadCodes();toast('Saved')}catch(e){if(!e.quiet)toast(msg(e))}},
  cdel:async function(el){try{await call({a:'adminDelCode',id:el.dataset.id});await loadCodes();toast('Code removed')}catch(e){if(!e.quiet)toast(msg(e))}},
  atab:function(el){S.atab=el.dataset.v;render();window.scrollTo(0,0);if(S.atab==='picks')loadPast();if(S.atab==='suggest'&&S.stats&&S.stats.apiKey){loadLeagues();loadEngine();if(!S.sug)sugFetch()}},
  date:function(el){S.date=el.dataset.v;S.open=null;render()},
  open:function(el){S.open=S.open===el.dataset.v?null:el.dataset.v;render()},
  log:function(el){
    var p=S.picks.filter(function(x){return x.id===el.dataset.v})[0];if(!p)return;
    S.prefill={note:(p.home+' vs '+p.away+' - '+p.market).slice(0,80),odds:p.odds.toFixed(2)};S.tab='mine';S.seg.mine='codes';render();window.scrollTo(0,0);
  },
  copy:function(el){
    var p=S.picks.filter(function(x){return x.id===el.dataset.v})[0];if(!p)return;
    var t=p.home+' vs '+p.away+' | '+p.market+' @ '+p.odds.toFixed(2);
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('Copied')},function(){toast(t)});else toast(t);
  },
  res:function(el){var c=find(el.dataset.id);if(!c)return;c.res=el.dataset.v==='pending'?'':el.dataset.v;touch();render()},
  delcode:function(el){
    var id=el.dataset.id,c=find(id);if(!c)return;
    S.modal={title:'Delete this code?',html:'<p class="mut" style="margin:0">'+esc(c.code)+' will be removed from your list.</p>',buttons:'<button type="button" class="btn ghost" data-act="mclose">Cancel</button><button type="button" class="btn" data-act="mdelcode" data-id="'+esc(id)+'">Delete</button>'};render();
  },
  mclose:function(){closeModal()},
  mdelcode:function(el){S.vault.codes=S.vault.codes.filter(function(c){return c.id!==el.dataset.id});S.modal=null;touch();render()},
  style:function(el){S.vault.prefs.style=el.dataset.v;touch();render()},
  export:function(){
    var blob=new Blob([JSON.stringify({exported:new Date().toISOString(),username:S.session.u,data:S.vault},null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='quito-the-tipster-my-data.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  },
  signout:function(){signOut()},
  refresh:async function(){setBusy(true);try{await adminLoad();render()}catch(e){if(!e.quiet)toast(msg(e))}setBusy(false)},
  loadusers:async function(){setBusy(true);try{var r=await call({a:'adminUsers'});S.users=r.users;render()}catch(e){if(!e.quiet)toast(msg(e))}setBusy(false)},
  ureset:async function(el){
    setBusy(true);
    try{var r=await call({a:'adminResetCode',id:el.dataset.id});S.users=(await call({a:'adminUsers'})).users;
      S.modal={title:'Reset code for @'+r.username,html:'<p class="mut" style="margin:0;line-height:1.5">Give this one-time code to the user. It works for 24 hours. Their saved codes and bankroll will start empty after the reset.</p><div class="code">'+esc(r.code)+'</div>',buttons:'<button type="button" class="btn" data-act="mclose">Done</button>'};render();
    }catch(e){if(!e.quiet)toast(msg(e))}
    setBusy(false);
  },
  ublock:async function(el){
    setBusy(true);
    try{await call({a:'adminSetStatus',id:el.dataset.id,status:el.dataset.v});S.users=(await call({a:'adminUsers'})).users;render()}catch(e){if(!e.quiet)toast(msg(e))}
    setBusy(false);
  },
  udel:function(el){
    S.modal={title:'Delete @'+el.dataset.n+'?',html:'<p class="mut" style="margin:0;line-height:1.5">This removes the account and all their saved data. It cannot be undone.</p>',buttons:'<button type="button" class="btn ghost" data-act="mclose">Cancel</button><button type="button" class="btn" data-act="mudel" data-id="'+esc(el.dataset.id)+'">Delete</button>'};render();
  },
  mudel:async function(el){
    setBusy(true);
    try{await call({a:'adminDeleteUser',id:el.dataset.id});S.users=(await call({a:'adminUsers'})).users;await adminLoad();S.modal=null;render();toast('User deleted')}catch(e){if(!e.quiet)toast(msg(e))}
    setBusy(false);
  },
  delpick:async function(el){
    setBusy(true);
    try{
      if(el.dataset.nb)await call({a:'adminNoBet',date:el.dataset.nb,on:false});else await call({a:'adminDelPick',id:el.dataset.id});
      await adminLoad();render();toast('Removed');
    }catch(e){if(!e.quiet)toast(msg(e))}
    setBusy(false);
  }
};

Object.assign(actions,{
  sopen:function(el){var k=el.dataset.v;S.sopen[k]=!S.sopen[k];render()},
  sugload:function(){sugFetch()},
  sugrefresh:async function(){
    setBusy(true);
    try{
      var r=await call({a:'adminRefresh',date:S.sdate});
      if(S.stats)S.stats.apiUsed=r.used;
      toast(r.fixtures+(r.fixtures===1?' fixture':' fixtures')+' from your leagues');
      var s=await call({a:'adminSuggest',date:S.sdate});S.sug=s;render();
    }catch(e){if(!e.quiet)toast(msg(e))}
    setBusy(false);
  },
  sugpost:async function(el){
    var f=S.sug&&S.sug.fixtures.filter(function(x){return x.fid===el.dataset.fid})[0];
    var m=f&&f.markets.filter(function(x){return x.k===el.dataset.k})[0];if(!m)return;
    var key=f.fid+'|'+m.k,o=Number(S.odds[key]);
    if(!(o>=1.01)){toast('Enter the SportyBet odds first');return}
    var e=m.p*100-100/o;
    if(e<S.thr&&!el.dataset.force){
      S.modal={title:'Small edge',html:'<p class="mut" style="margin:0;line-height:1.5">The edge is <b style="color:var(--tx)">'+(e>=0?'+':'')+e.toFixed(1)+' pts</b> and you asked for at least '+S.thr+'. Post it anyway?</p>',buttons:'<button type="button" class="btn ghost" data-act="mclose">Cancel</button><button type="button" class="btn" data-act="sugpost" data-fid="'+esc(f.fid)+'" data-k="'+esc(m.k)+'" data-force="1">Post anyway</button>'};render();return;
    }
    S.modal=null;setBusy(true);
    try{
      await call({a:'adminAddPick',date:S.sug.date,sport:f.sport,league:f.league,kickoff:f.kick,home:f.home,away:f.away,market:m.l,odds:o,ours:Math.round(m.p*100),risk:m.p>=0.7?'Low':m.p>=0.5?'Medium':'High',why:'Model: expected goals '+f.xh+' - '+f.xa+' from '+f.n+' league matches. Edge '+(e>=0?'+':'')+e.toFixed(1)+' pts at SportyBet odds.',fid:f.fid,mkey:m.k});
      S.posted[key]=true;await adminLoad();render();toast('Pick posted');
    }catch(er){if(!er.quiet){render();toast(msg(er))}}
    setBusy(false);
  },
  ladd:async function(el){
    setBusy(true);
    try{var ra=await call({a:'adminAddLeague',id:el.dataset.id,name:el.dataset.n,country:el.dataset.c,season:el.dataset.s,sport:S.lsport});await loadLeagues();toast('League added'+(ra.hist&&ra.hist.matches?' · '+ra.hist.matches+' past matches loaded':ra.hist&&ra.hist.why?' · '+ra.hist.why:''))}catch(e){if(!e.quiet)toast(msg(e))}
    setBusy(false);
  },
  drvsync:async function(){
    setBusy(true);
    try{var r=await call({a:'adminSyncDrive'});toast(r.ingested+(r.ingested===1?' new file':' new files')+' read · '+r.rows+' matches'+(r.unread&&r.unread.length?' · '+r.unread.length+' not recognised':''));await loadEngine();await loadLeagues()}
    catch(e){if(!e.quiet)toast(msg(e))}
    setBusy(false);
  },
  train:async function(){
    setBusy(true);var ls=(S.eng&&S.eng.leagues)||[],ok=0,short=0;
    try{
      for(var i=0;i<ls.length;i++){
        toast('Training '+ls[i].name+' ('+(i+1)+' of '+ls.length+')...');
        var r=await call({a:'adminTrain',league:ls[i].id});
        if(r.reports&&r.reports[0]&&r.reports[0].ok)ok++;else short++;
      }
      toast(ok+(ok===1?' league':' leagues')+' trained'+(short?' · '+short+' need more matches':''));
      await loadEngine();
    }catch(e){if(!e.quiet)toast(msg(e))}
    setBusy(false);
  },
  histload:async function(){
    setBusy(true);
    try{
      var r=await call({a:'adminImportHistory'});
      var ok=r.results.filter(function(x){return x.ok}),tot=ok.reduce(function(a,x){return a+x.matches},0);
      var bad=r.results.filter(function(x){return !x.ok&&!x.why});
      toast(ok.length?tot+' past matches loaded for '+ok.length+(ok.length===1?' league':' leagues')+(bad.length?' · '+bad.length+' failed':''):(bad.length?'Could not fetch the past-season files. Use "Add a past-season file" below.':'None of these leagues has a free past-season file.'));
      await loadLeagues();
    }catch(e){if(!e.quiet)toast(msg(e))}
    setBusy(false);
  },
  ldel:async function(el){
    setBusy(true);
    try{await call({a:'adminDelLeague',id:el.dataset.id});await loadLeagues();toast('League removed')}catch(e){if(!e.quiet)toast(msg(e))}
    setBusy(false);
  },
  grade:async function(){
    setBusy(true);
    try{var r=await call({a:'adminGrade'});if(S.stats)S.stats.apiUsed=r.used;toast(r.graded+(r.graded===1?' result':' results')+' marked');await adminLoad();await loadPast()}catch(e){if(!e.quiet)toast(msg(e))}
    setBusy(false);
  },
  pset:async function(el){
    var v=el.dataset.v===el.dataset.cur?'':el.dataset.v;
    setBusy(true);
    try{await call({a:'adminSetResult',id:el.dataset.id,res:v});await adminLoad();await loadPast()}catch(e){if(!e.quiet)toast(msg(e))}
    setBusy(false);
  }
});

app.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var f=actions[el.dataset.act];if(f){ev.preventDefault();f(el)}
});
document.addEventListener('click',function(ev){
  var el=ev.target.closest('.modal [data-act]');if(!el||app.contains(el))return;
  var f=actions[el.dataset.act];if(f){ev.preventDefault();f(el)}
});
app.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.dataset&&el.dataset.sug){S.odds[el.dataset.sug]=el.value;var tg=document.getElementById('e-'+el.dataset.sug.replace('|','-'));if(tg)tg.innerHTML=edgeText(Number(el.dataset.p),Number(el.value));return}
  if(el.dataset&&el.dataset.bind==='gq'){S.gm.q=el.value;var gl=$('#glist');if(gl)gl.innerHTML=gList();return}
  if(el.dataset&&el.dataset.bind==='uq'){S.q=el.value;var pos=el.selectionStart;render();var n=$('#uq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
});
app.addEventListener('change',function(ev){
  var el=ev.target,b=el.dataset&&el.dataset.bind;if(!b)return;
  if(S.view==='admin'){
    if(b==='sdate'){S.sdate=el.value;if(S.sdate)sugFetch();return}
    if(b==='thr'){S.thr=Number(el.value)||7;lsSet('qt_thr',String(S.thr));render();return}
    if(b==='lsport'){S.lsport=el.value;return}
    if(b==='csvfiles'){var fl=Array.prototype.slice.call(el.files||[]);el.value='';uploadCsvFiles(fl);return}
    return;
  }
  if(!S.vault)return;
  var bank=S.vault.bank;
  if(b==='amt'){bank.amt=Math.max(0,Number(el.value)||0)}
  else if(b==='limit'){bank.limit=Math.max(0,Number(el.value)||0)}
  else if(b==='pct'){bank.pct=Number(el.value)||2}
  else if(b==='cur'){bank.cur=el.value}
  else if(b==='sport'){S.vault.prefs.sports[el.dataset.k]=el.checked}
  else return;
  touch();render();
});
app.addEventListener('submit',function(ev){
  var form=ev.target.closest('form[data-form]');if(!form)return;
  ev.preventDefault();
  var h=forms[form.dataset.form];if(!h)return;
  var fd={};new FormData(form).forEach(function(v,k){fd[k]=v});
  fd.checked=function(n){var e=form.elements[n];return !!(e&&e.checked)};
  showErr('');var e2=$('#err2');if(e2)e2.textContent='';var e3=$('#err3');if(e3)e3.textContent='';
  setBusy(true);
  Promise.resolve(h(fd,form)).catch(function(e){if(e&&e.quiet)return;var t=e&&e.local?e.local:msg(e);var tgt=(e&&e.target)?$('#'+e.target):null;if(tgt)tgt.textContent=t;else showErr(t)}).then(function(){setBusy(false)});
});
function bad(t,target){throw {local:t,target:target}}
function uname(s){return String(s||'').trim().toLowerCase()}

var forms={
  api:async function(f){
    var u=String(f.api||'').trim();
    if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_\-]+\/exec$/.test(u)&&!/^https:\/\/script\.googleusercontent\.com\//.test(u))bad('That does not look like the web app link. It should start with https://script.google.com/macros/s/ and end with /exec');
    lsSet('qt_api',u);
    var r=await api({a:'ping'});
    if(!r.setup)bad('Connected, but the server has not been set up yet. Run setup in Apps Script first.');
    S.view='auth';render();
  },
  login:async function(f){
    var u=uname(f.u),p=String(f.p||'');
    if(!u||!p)bad('Enter your username and password.');
    var r;
    if(u==='admin'){
      r=await api({a:'login',u:'admin',pw:p});
      S.session={t:r.token,role:'a',u:'Admin'};
    }else{
      var d=await derive(u,p);
      r=await api({a:'login',u:u,auth:d.auth});
      S.session={t:r.token,role:'c',u:u,raw:d.raw};
    }
    saveSession(f.checked('remember'));
    await enter();
  },
  signup:async function(f){
    var u=uname(f.u),p=String(f.p||''),ph=String(f.ph||'').trim();
    if(!/^[a-z0-9][a-z0-9_.]{2,19}$/.test(u))bad(ERR.BAD_NAME);
    if(p.length<8)bad(ERR.WEAK);
    if(p!==f.p2)bad('The two passwords do not match.');
    if(!f.checked('age'))bad('You must be 18 or older to use this app.');
    var d=await derive(u,p);
    var r=await api({a:'signup',u:u,auth:d.auth,phone:ph});
    S.session={t:r.token,role:'c',u:u,raw:d.raw};
    saveSession(true);
    await enter();
    toast('Welcome, @'+u);
  },
  forgot:async function(f){
    var u=uname(f.u),c=String(f.c||'').replace(/\s/g,''),p=String(f.p||'');
    if(!/^\d{8}$/.test(c))bad('The reset code has 8 digits.');
    if(p.length<8)bad(ERR.WEAK);
    if(p!==f.p2)bad('The two passwords do not match.');
    var d=await derive(u,p);
    await api({a:'reset',u:u,code:c,auth:d.auth});
    S.view='auth';S.authMode='login';render();toast('Password changed. Log in with the new one.');
  },
  addcode:async function(f){
    var code=String(f.code||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!code)bad('Enter the booking code.');
    if(S.vault.codes.some(function(c){return c.code===code&&c.res!=='lost'&&c.res!=='won'}))bad('That code is already in your list.');
    S.vault.codes.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),code:code,odds:Math.max(0,Number(f.odds)||0),stake:Math.max(0,Number(f.stake)||0),note:String(f.note||'').trim().slice(0,80),res:'',ts:Date.now()});
    S.prefill=null;touch();render();toast('Code saved');
  },
  chpw:async function(f){
    var op=String(f.op||''),np=String(f.np||'');
    if(np.length<8)bad(ERR.WEAK);
    if(np!==f.np2)bad('The two new passwords do not match.');
    var u=S.session.u,o=await derive(u,op),n=await derive(u,np);
    var blob=await sealVault(n.raw,S.vault);
    var r=await call({a:'changePassword',oldAuth:o.auth,newAuth:n.auth,blob:blob});
    S.session.t=r.token;S.session.raw=n.raw;
    saveSession(!!lsGet('qt_s')||!ssGet('qt_s'));
    render();toast('Password changed');
  },
  delacct:async function(f){
    if(String(f.dt||'').trim()!=='DELETE')bad('Type DELETE in capital letters to confirm.','err2');
    var d=await derive(S.session.u,String(f.dp||''));
    try{await call({a:'deleteAccount',auth:d.auth})}catch(e){if(e&&e.quiet)throw e;bad(msg(e),'err2')}
    S.session=null;S.vault=null;lsDel('qt_s');ssDel('qt_s');S.view='auth';S.authMode='login';render();
    toast('Your account and saved data were deleted.');
  },
  lcode:async function(f){
    if(!f.date)bad(ERR.BAD_DATE);
    var lj=S.lb.legs.length?S.lb.legs.map(function(g){return {fid:g.fid,mk:g.mk,odds:g.odds||0}}):'';
    await call({a:'adminAddCode',date:f.date,title:f.title,code:f.code,odds:f.odds,risk:f.risk,legs:f.legs,note:f.note,lj:lj});
    S.lb.legs=[];S.lf={};await loadCodes();render();toast('Code listed');
  },
  addpick:async function(f){
    await call({a:'adminAddPick',date:f.date,sport:f.sport,league:f.league,kickoff:f.kickoff,home:f.home,away:f.away,market:f.market,odds:f.odds,ours:f.ours,risk:f.risk,why:f.why});
    await adminLoad();render();toast('Pick posted');
  },
  nobet:async function(f){
    if(!f.date)bad(ERR.BAD_DATE,'err3');
    try{await call({a:'adminNoBet',date:f.date,on:true,note:f.note})}catch(e){if(!e.quiet)bad(msg(e),'err3');throw e}
    await adminLoad();render();toast('No bet day set');
  },
  drvfolder:async function(f){
    if(!String(f.folder||'').trim())bad(ERR.BAD_FOLDER);
    var r=await call({a:'adminSetDriveFolder',folder:f.folder});
    await loadEngine();toast('Now saving to: '+r.name);
  },
  apikey:async function(f){
    var k=String(f.key||'').trim();
    if(!/^[A-Za-z0-9]{16,100}$/.test(k))bad(ERR.BAD_KEY);
    await call({a:'adminSetApiKey',key:k});
    await adminLoad();S.leagues=null;S.sug=null;render();loadLeagues();toast('Key saved');
  },
  csvimport:async function(f){
    var r=await call({a:'adminImportCsv',league:f.league,csv:f.csv});
    await loadLeagues();toast(r.added+' matches read · '+r.matches+' saved');
  },
  lsearch:async function(f){
    var r=await call({a:'adminLeagueSearch',q:f.q});
    S.lres=r.results;if(S.stats)S.stats.apiUsed=r.used;render();
  },
  adminpw:async function(f){
    var np=String(f.np||'');
    if(np.length<8)bad(ERR.WEAK);
    if(np!==f.np2)bad('The two new passwords do not match.');
    var r=await call({a:'adminChangePassword',oldPw:f.op,newPw:np});
    S.session.t=r.token;saveSession(!!lsGet('qt_s'));render();toast('Admin password changed');
  }
};

setInterval(function(){if(S.view==='app'&&S.tab==='games'&&S.gm.date===S.today&&document.visibilityState==='visible'&&!S.gm.busy){if(S.gm.open){var st=S.gm.open.f[2];if(st==='L'||st==='HT')loadMatch()}else loadDay(S.today)}},60000);
document.addEventListener('keydown',function(ev){var el=ev.target;if((ev.key==='Enter'||ev.key===' ')&&el&&el.dataset&&el.dataset.act==='gopen'){ev.preventDefault();el.click()}});
boot();
})();
</script>
