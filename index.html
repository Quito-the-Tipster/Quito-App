<style>
:root{--bg:#17181A;--card:#212326;--card2:#1c1d1f;--line:#35383C;--tx:#F3F3F1;--mut:#A0A4A9;--red:#E4121B;--redt:#FF4D4D;--redbg:#3A1316;--r:18px}
*{box-sizing:border-box}
html,body{margin:0;background:#0f1011;color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
#app{width:100%;max-width:480px;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column}
.h1{font-family:Montserrat,Inter,sans-serif;font-style:italic;font-weight:800;letter-spacing:-.01em;margin:0}
.mut{color:var(--mut)}
.red{color:var(--redt)}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:44px;height:44px;border-radius:12px;display:block}
.brand b{font-family:Montserrat,Inter,sans-serif;font-style:italic;font-weight:800;font-size:17px;line-height:1}
.badge{border:1px solid var(--red);color:var(--redt);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;letter-spacing:.06em}
.main{flex:1;padding:4px 16px 96px}
.nav{position:fixed;bottom:0;width:100%;max-width:480px;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:0 8px env(safe-area-inset-bottom)}
.nav button{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:none;font-size:12px;font-weight:600;color:var(--mut)}
.nav button[aria-current=page]{color:var(--redt)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 10px}
.card h3{margin:0 0 8px;font-family:Montserrat,Inter,sans-serif;font-style:italic;font-weight:800;font-size:16px}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mut);margin:12px 0 6px;text-transform:uppercase}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],input[type=tel],select,textarea{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card2);padding:0 14px;font-size:16px}
textarea{padding:12px 14px;min-height:80px;resize:vertical}
input::placeholder,textarea::placeholder{color:#7d8186}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--redt);outline-offset:2px}
.btn{min-height:50px;border-radius:16px;border:0;background:var(--red);color:#fff;font-weight:700;font-size:16px;padding:0 18px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:none;border:1px solid #5A5E63;color:var(--tx);font-weight:600}
.btn.danger{background:none;border:1px solid var(--red);color:var(--redt)}
.btn.sm{min-height:44px;width:auto;font-size:14px;padding:0 14px;border-radius:12px}
.btn[disabled]{opacity:.5}
.link{background:none;border:0;min-height:44px;color:var(--redt);font-weight:600;font-size:14px;padding:0 4px}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.sp{justify-content:space-between}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;min-height:40px;border-radius:10px;border:0;background:none;color:var(--mut);font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:#F3F3F1;color:#17181A}
.err{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--redbg);border:1px solid var(--red);color:#ffd0d0;font-size:14px}
.err:empty{display:none}
.ok{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:#1d2a20;border:1px solid #2f5b3b;color:#cdeed6;font-size:14px}
.note{font-size:12px;line-height:1.5;color:var(--mut)}
.hero img{width:100%;height:auto;display:block;border-radius:20px}
.chip{display:inline-block;background:var(--redbg);color:var(--redt);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dt{flex:0 0 auto;min-width:68px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.dt small{font-size:11px;color:var(--mut)}
.dt b{font-family:Montserrat,Inter,sans-serif;font-style:italic;font-weight:800;font-size:18px}
.dt[aria-pressed=true]{background:var(--red);border-color:var(--red)}
.dt[aria-pressed=true] small{color:#fff}
.pick{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 10px}
.meta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.teams{font-weight:700;font-size:17px;margin:6px 0 0}
.bar{margin-top:10px;height:6px;border-radius:3px;background:var(--line);position:relative}
.bar i{position:absolute;left:0;top:0;height:6px;border-radius:3px;background:var(--red)}
.bar u{position:absolute;top:-3px;width:2px;height:12px;background:#fff}
.stat{flex:1;text-align:center;padding:12px 4px}
.stat b{display:block;font-family:Montserrat,Inter,sans-serif;font-style:italic;font-weight:800;font-size:24px}
.stat span{font-size:11px;color:var(--mut)}
.nobet{text-align:center;padding:26px 6px 10px}
.nobet h2{font-size:44px;line-height:1.02;margin:14px 0 8px}
.pill{display:inline-block;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.pill.w{background:var(--red);color:#fff}
.pill.l{border:1px solid #5A5E63;color:var(--mut)}
.pill.p{border:1px solid var(--red);color:var(--redt)}
.chk{display:flex;align-items:center;justify-content:space-between;min-height:48px;border-bottom:1px solid var(--line);font-size:15px;font-weight:500}
.chk:last-child{border:0}
input[type=checkbox]{accent-color:var(--red);width:22px;height:22px;margin:0}
.meter{height:8px;border-radius:4px;background:var(--line)}
.meter i{display:block;height:8px;border-radius:4px;background:var(--red)}
.top-bar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:3px;overflow:hidden;z-index:50;display:none}
.busy .top-bar{display:block}
.top-bar i{display:block;height:3px;width:40%;background:var(--red);animation:mv 1s infinite ease-in-out}
@keyframes mv{0%{margin-left:-40%}100%{margin-left:100%}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#F3F3F1;color:#17181A;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;z-index:60;max-width:90%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.modal>div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:380px;width:100%}
.code{font-family:Montserrat,Inter,sans-serif;font-style:italic;font-weight:800;font-size:34px;letter-spacing:.12em;text-align:center;margin:14px 0}
.spin{display:flex;align-items:center;justify-content:center;min-height:100vh}
.spin img{width:88px;height:88px;border-radius:22px;animation:rot 1.2s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.saved{font-size:11px;color:var(--mut);text-align:right;min-height:14px;padding:0 4px 6px}
.u{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.u:last-child{border:0}
.u b{font-size:15px}
.u small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:481px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){.spin img,.top-bar i{animation:none}}
</style>
</head>

}
function importKey(raw){return crypto.subtle.importKey('raw',b64d(raw),'AES-GCM',false,['encrypt','decrypt'])}
async function sealVault(raw,obj){
  var key=await importKey(raw),iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(JSON.stringify(obj))));

}
async function openVault(raw,blob){
  var p=blob.split('.');if(p.length!==2)throw new Error('format');
  var key=await importKey(raw);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(p[0])},key,b64d(p[1]));
  return JSON.parse(dec.decode(pt));
}

async function api(d){
  var url=apiUrl();if(!url)throw {err:'NO_API'};
  var r,j;
  try{r=await fetch(url,{method:'POST',body:JSON.stringify(d)})}catch(e){throw {err:'NETWORK'}}
  try{j=await r.json()}catch(e){throw {err:'SERVER'}}
  if(!j||!j.ok){
    if(j&&j.err==='AUTH_REQUIRED'&&S.session&&d.a!=='login'){signOut('Please sign in again.');throw {err:'AUTH_REQUIRED',quiet:true}}
    throw j||{err:'SERVER'};
  }
  return j;
}

function touch(){
  S.saved='Saving...';paintSaved();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(!S.session||S.session.role!=='c'||!S.vault)return;
  try{
    var blob=await sealVault(S.session.raw,S.vault);
    await call({a:'putVault',blob:blob});
    S.saved='Saved and encrypted';
  }catch(e){
    S.saved=(e&&e.err==='TOO_BIG')?'Too much data. Delete old codes.':'Not saved yet. Check your internet.';
    if(e&&e.err!=='TOO_BIG'&&e.err!=='AUTH_REQUIRED')saveTimer=setTimeout(flush,8000);
  }
  paintSaved();
}

async function boot(){

  var s=loadSession();
  if(!s){S.view='auth';render();return}
  S.session=s;
  try{await enter(true)}catch(e){
    if(e&&e.err==='NETWORK'){S.view='auth';S.session=null;render();toast(msg(e));return}
    if(!(e&&e.quiet)){S.session=null;lsDel('qt_s');ssDel('qt_s');S.view='auth';render()}

async function enter(){
  if(S.session.role==='a'){

function bad(t,target){throw {local:t,target:target}}
function uname(s){return String(s||'').trim().toLowerCase()}

var forms={
  api:async function(f){
    var u=String(f.api||'').trim();
    if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_\-]+\/exec$/.test(u)&&!/^https:\/\/script\.googleusercontent\.com\//.test(u))bad('That does not look like the web app link. It should start with https://script.google.com/macros/s/ and end with /exec');
    lsSet('qt_api',u);
    var r=await api({a:'ping'});
    if(!r.setup)bad('Connected, but the server has not been set up yet. Run setup in Apps Script first.');
    S.view='auth';render();
  },
  login:async function(f){
    var u=uname(f.u),p=String(f.p||'');
    if(!u||!p)bad('Enter your username and password.');
    var r;
    if(u==='admin'){
      r=await api({a:'login',u:'admin',pw:p});
      S.session={t:r.token,role:'a',u:'Admin'};
    }else{
      var d=await derive(u,p);
      r=await api({a:'login',u:u,auth:d.auth});
      S.session={t:r.token,role:'c',u:u,raw:d.raw};
    }
    saveSession(f.checked('remember'));
    await enter();
  },
  signup:async function(f){
    var u=uname(f.u),p=String(f.p||''),ph=String(f.ph||'').trim();
    if(!/^[a-z0-9][a-z0-9_.]{2,19}$/.test(u))bad(ERR.BAD_NAME);
    if(p.length<8)bad(ERR.WEAK);
    if(p!==f.p2)bad('The two passwords do not match.');
    if(!f.checked('age'))bad('You must be 18 or older to use this app.');
    var d=await derive(u,p);
    var r=await api({a:'signup',u:u,auth:d.auth,phone:ph});
    S.session={t:r.token,role:'c',u:u,raw:d.raw};
    saveSession(true);
    await enter();
    toast('Welcome, @'+u);
  },
  forgot:async function(f){
    var u=uname(f.u),c=String(f.c||'').replace(/\s/g,''),p=String(f.p||'');
    if(!/^\d{8}$/.test(c))bad('The reset code has 8 digits.');
    if(p.length<8)bad(ERR.WEAK);
    if(p!==f.p2)bad('The two passwords do not match.');
    var d=await derive(u,p);
    await api({a:'reset',u:u,code:c,auth:d.auth});
    S.view='auth';S.authMode='login';render();toast('Password changed. Log in with the new one.');
  },
  addcode:async function(f){
    var code=String(f.code||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!code)bad('Enter the booking code.');
    if(S.vault.codes.some(function(c){return c.code===code&&c.res!=='lost'&&c.res!=='won'}))bad('That code is already in your list.');
    S.vault.codes.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),code:code,odds:Math.max(0,Number(f.odds)||0),stake:Math.max(0,Number(f.stake)||0),note:String(f.note||'').trim().slice(0,80),res:'',ts:Date.now()});
    S.prefill=null;touch();render();toast('Code saved');
  },
  chpw:async function(f){
    var op=String(f.op||''),np=String(f.np||'');
    if(np.length<8)bad(ERR.WEAK);
    if(np!==f.np2)bad('The two new passwords do not match.');
    var u=S.session.u,o=await derive(u,op),n=await derive(u,np);
    var blob=await sealVault(n.raw,S.vault);
    var r=await call({a:'changePassword',oldAuth:o.auth,newAuth:n.auth,blob:blob});
    S.session.t=r.token;S.session.raw=n.raw;
    saveSession(!!lsGet('qt_s')||!ssGet('qt_s'));
    render();toast('Password changed');
  },
  delacct:async function(f){
    if(String(f.dt||'').trim()!=='DELETE')bad('Type DELETE in capital letters to confirm.','err2');
    var d=await derive(S.session.u,String(f.dp||''));
    try{await call({a:'deleteAccount',auth:d.auth})}catch(e){if(e&&e.quiet)throw e;bad(msg(e),'err2')}
    S.session=null;S.vault=null;lsDel('qt_s');ssDel('qt_s');S.view='auth';S.authMode='login';render();
    toast('Your account and saved data were deleted.');
  },
  addpick:async function(f){
    await call({a:'adminAddPick',date:f.date,sport:f.sport,league:f.league,kickoff:f.kickoff,home:f.home,away:f.away,market:f.market,odds:f.odds,ours:f.ours,risk:f.risk,why:f.why});
    await adminLoad();render();toast('Pick posted');
  },
  nobet:async function(f){
    if(!f.date)bad(ERR.BAD_DATE,'err3');
    try{await call({a:'adminNoBet',date:f.date,on:true,note:f.note})}catch(e){if(!e.quiet)bad(msg(e),'err3');throw e}
    await adminLoad();render();toast('No bet day set');
  },
  adminpw:async function(f){
    var np=String(f.np||'');
    if(np.length<8)bad(ERR.WEAK);
    if(np!==f.np2)bad('The two new passwords do not match.');
    var r=await call({a:'adminChangePassword',oldPw:f.op,newPw:np});
    S.session.t=r.token;saveSession(!!lsGet('qt_s'));render();toast('Admin password changed');
  }
};

document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.modal)closeModal()});
window.addEventListener('pagehide',function(){if(saveTimer){clearTimeout(saveTimer);flush()}});
boot();
})();
</script>
</body>
</html>
